<div style="font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; max-width: 720px;">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<div aria-label="Ladataan" style="display: flex; flex-direction: column; gap: 10px;">
<div style="width: 90px; height: 12px; border-radius: var(--radius-sm); background: var(--skeleton);"></div>
<div style="width: 100%; height: 22px; border-radius: var(--radius-sm); background: var(--skeleton);"></div>
<div style="width: 70%; height: 22px; border-radius: var(--radius-sm); background: var(--skeleton);"></div>
<div style="width: 100%; height: 12px; border-radius: var(--radius-sm); background: var(--skeleton); margin-top: 8px;"></div>
<div style="width: 92%; height: 12px; border-radius: var(--radius-sm); background: var(--skeleton);"></div>
<div style="width: 60%; height: 12px; border-radius: var(--radius-sm); background: var(--skeleton);"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
<div class="title" style="color: var(--danger);">Sivua ei löytynyt</div>
<div class="body-sm" style="color: var(--ink-muted);">Sivua 345 ei ole juuri nyt lähetyksessä.</div>
<a href="#" class="body-sm" style="color: var(--link); font-weight: 600; min-height: var(--touch); display: flex; align-items: center;">Etusivulle ›</a>
</div>
<script></script>
</div>
