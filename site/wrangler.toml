name = "satanen-web"
main = "src/index.mjs"
compatibility_date = "2026-10-01"

# The web app: a static single-page app built into ../dist by `npm run build:web`.
# No account id and no secrets here (D17).

[assets]
directory = "../dist"
binding = "ASSETS"
# Existing files are served straight from the assets, free and not counted as
# Worker requests (D57). The worker runs only when no file matches: it answers
# 404 for missing script files and sends every other unknown path to
# index.html (the app shows page 105 for /105). Do not set run_worker_first:
# then every file of every visit counts toward the daily Worker limit.

# Custom domain: Cloudflare creates the DNS record and certificate on deploy.
# satanen.io must be an active zone in the same Cloudflare account.
[[routes]]
pattern = "satanen.io"
custom_domain = true
