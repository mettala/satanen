<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Siirry sivulle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Schibsted Grotesk',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.scrimBase}}; color: {{t.ink}}; display: flex; flex-direction: column; font-family: 'Schibsted Grotesk', system-ui, sans-serif;">
<div style="height: 56px; flex-shrink: 0;"></div>
<div style="flex-grow: 1; background: {{t.surface}}; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; overflow: hidden;">

<div style="padding: 12px 8px 0 20px; display: flex; align-items: center;">
<div style="flex-grow: 1; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;">Siirry sivulle</div>
<a href="01-etusivu.dc.html" aria-label="Sulje" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="padding: 8px 20px 0;">
<label style="height: 52px; border-radius: 12px; background: {{t.field}}; border: 2px solid {{t.focus}}; display: flex; align-items: center; gap: 2px; padding: 0 16px; font-size: 28px; font-weight: 800; letter-spacing: 0.12em; font-variant-numeric: tabular-nums;">2<span style="width: 2px; height: 28px; background: {{t.focus}};"></span><span style="color: {{t.muted}}; font-weight: 500;">__</span></label>
</div>

<div style="padding: 14px 20px 0; display: flex; flex-direction: column;">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: {{t.muted}}; padding-bottom: 4px;">SUOSIKEISTASI</div>
<a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 44px; border-top: 1px solid {{t.line}};"><span style="width: 44px; font-size: 15px; font-variant-numeric: tabular-nums;"><b>2</b><span style="color: {{t.muted}};">35</span></span><span style="flex-grow: 1; font-size: 16px; font-weight: 500;">Liiga-tulokset</span><span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.sport}};"></span></a>
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: {{t.muted}}; padding: 12px 0 4px;">URHEILU · 2XX</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 44px; border-top: 1px solid {{t.line}};"><span style="width: 44px; font-size: 15px; font-variant-numeric: tabular-nums;"><b>2</b><span style="color: {{t.muted}};">{{r.rest}}</span></span><span style="flex-grow: 1; font-size: 16px; font-weight: 500;">{{r.name}}</span><span style="font-size: 13px; color: {{t.muted}};">{{r.range}}</span></a>
</sc-for>
</div>

<div style="margin-top: auto; background: {{t.kb}}; padding: 8px 6px 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12"><div style="height: 46px; border-radius: 6px; background: {{t.key}}; display: flex; align-items: center; justify-content: center; font-size: 22px; color: {{t.ink}};">{{k}}</div></sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const themes = {
light: { scrimBase: '#8A8D93', surface: '#FFFFFF', ink: '#15181D', muted: '#5D636E', line: '#E1E4E9', field: '#ECEEF2', focus: '#1D47B8', sport: '#2B7A35', kb: '#D3D6DB', key: '#FFFFFF' },
dark: { scrimBase: '#0A0B0D', surface: '#1F232A', ink: '#ECEEF1', muted: '#A0A7B2', line: '#2E333B', field: '#262B33', focus: '#9DB6FF', sport: '#6DD27C', kb: '#2A2F37', key: '#3A4049' }
};
return {
t: themes[this.props.mode] || themes.light,
rows: [
{ rest: '00', name: 'Urheilun etusivu', range: '' },
{ rest: '0x', name: 'Urheilu-uutiset', range: '201–209' },
{ rest: '3x', name: 'Jääkiekko', range: '230–239' },
{ rest: '4x', name: 'Talviurheilu', range: '240–249' },
{ rest: '6x', name: 'Jalkapallo', range: '260–269' }
],
keys: ['1','2','3','4','5','6','7','8','9','','0','⌫']
};
}
}
</script>
</body>
</html>
