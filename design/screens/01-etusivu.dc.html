class Component extends DCLogic {
renderVals() {

const one = ['.X.', 'XX.', '.X.', '.X.', 'XXX'], zero = ['XXX', 'X.X', 'X.X', 'X.X', 'XXX'], cols = ['#86A6FF', '#6DD27C', '#F2A35E'], logo = [];

]

}
